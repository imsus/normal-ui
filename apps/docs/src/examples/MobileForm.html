<!-- @dsCard level="pages" group="Mobile" height=1010 width=390 page subtitle="A long form: stacked fields, the right keyboard for each input, an inline error and a sticky save bar" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New product · Toko Rumah</title>
<style>
  :root { --tap: 48px; --bar: 56px; }
  *, *::before, *::after { box-sizing:border-box; }
  body { margin:0; }
  .vh { position:absolute !important; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  .skip { position:absolute; left:var(--space-sm); top:-100px; z-index:3; }
  .skip:focus { top:var(--space-sm); background:var(--canvas); padding:var(--space-xs) var(--space-sm); }

  /* Top app bar */
  .m-bar { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:var(--space-sm);
    min-height:var(--bar); padding:env(safe-area-inset-top, 0px) var(--space-md) 0; background:var(--canvas); border-bottom:1px solid var(--rule); }
  .m-bar h1 { flex:1; margin:0; font-size:1.25rem; line-height:1.2; }
  .m-bar .back { display:inline-flex; align-items:center; min-height:var(--tap); min-width:var(--tap); margin-inline-start:calc(-1 * var(--space-sm)); padding-inline:var(--space-sm); }
  .m-bar .act { display:inline-flex; align-items:center; min-height:var(--tap); padding-inline:var(--space-sm); font:1rem var(--font-sans); }
  .m-bar .back { font:1rem var(--font-sans); }

  /* Content column: 16px gutters, room for the tab bar */
  .m-main { padding:var(--space-md) var(--space-md) calc(var(--bar) + var(--space-lg) + env(safe-area-inset-bottom, 0px)); max-width:40rem; margin-inline:auto; }
  .m-main.no-tabs { padding-bottom:calc(var(--space-lg) + env(safe-area-inset-bottom, 0px)); }
  .m-main > :first-child { margin-top:0; }

  /* Bottom tab bar */
  .m-tabs { position:fixed; inset:auto 0 0 0; z-index:2; background:var(--canvas); border-top:1px solid var(--control-border); padding-bottom:env(safe-area-inset-bottom, 0px); }
  .m-tabs ul { display:grid; grid-template-columns:repeat(4, 1fr); list-style:none; margin:0; padding:0; }
  .m-tabs a { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:var(--bar);
    font:0.8125rem/1.2 var(--font-sans); color:var(--canvas-text); text-decoration:none; border-top:3px solid transparent; }
  .m-tabs a[aria-current] { font-weight:700; border-top-color:var(--link); color:var(--link); }
  .m-tabs svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }

  /* Touch sizing: 48px controls, 16px text so phones never zoom into fields */
  .m-main :is(input:not([type=checkbox],[type=radio]), select, textarea) { width:100%; min-height:var(--tap); font-size:1rem; }
  .m-main button { min-height:var(--tap); }
  .block { width:100%; }
  .muted { color:var(--gray-text); }
  .num { text-align:end; font-variant-numeric:tabular-nums; }
  .field { display:grid; gap:var(--space-xs); margin-block:var(--space-md); }
  .hint { font-size:.83em; color:var(--gray-text); }
  .error { font-size:.83em; font-weight:700; }

  fieldset { border:0; padding:0; margin:0 0 var(--space-lg); }
  legend { font-size:1.125rem; font-weight:700; padding:0; margin-bottom:var(--space-xs); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-sm); }
  .row2 .field { margin-block:var(--space-sm); }
  .check { display:flex; align-items:center; gap:var(--space-xs); min-height:var(--tap); }
  .savebar { position:sticky; bottom:0; margin-inline:calc(-1 * var(--space-md)); padding:var(--space-sm) var(--space-md) calc(var(--space-sm) + env(safe-area-inset-bottom, 0px));
    background:var(--canvas); border-top:1px solid var(--control-border); display:grid; grid-template-columns:1fr 2fr; gap:var(--space-sm); }
  .prefix { display:flex; }
  .prefix span { display:flex; align-items:center; padding-inline:var(--space-sm); border:1px solid var(--control-border); border-inline-end:0; background:var(--surface-muted); color:var(--button-text); font:1rem var(--font-sans); }
</style>
</head>
<body class="pd-app">
<a class="skip" href="#main">Skip to main content</a>
<header class="m-bar">
<a class="back" href="#products"><span aria-hidden="true">‹&nbsp;</span>Products</a>
</header>
<main id="main" class="m-main no-tabs">
<h1 style="font-size:1.5rem;margin:0 0 var(--space-md)">New product</h1>
<form id="pf" novalidate>
  <fieldset>
    <legend>Details</legend>
    <div class="field">
      <label for="n">Name</label>
      <input id="n" value="Rattan tray" autocapitalize="sentences" enterkeyhint="next">
    </div>
    <div class="field">
      <label for="c">Category</label>
      <select id="c"><option>Clothing</option><option selected>Home and kitchen</option><option>Food</option></select>
    </div>
    <div class="field">
      <label for="d">Description</label>
      <span class="hint" id="d-hint">Size, material and care. Shown in the shop.</span>
      <textarea id="d" aria-describedby="d-hint">Hand-woven in Cirebon. 45 × 30 cm.</textarea>
    </div>
  </fieldset>

  <fieldset>
    <legend>Price and stock</legend>
    <div class="field">
      <label for="p">Price</label>
      <span class="error" id="p-err">Enter a price in whole rupiah, like 150000</span>
      <div class="prefix"><span aria-hidden="true">Rp</span><input id="p" inputmode="numeric" value="150.000,50" aria-invalid="true" aria-describedby="p-err"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="s">Stock</label>
        <input id="s" type="number" inputmode="numeric" min="0" value="12">
      </div>
      <div class="field">
        <label for="w">Weight (g)</label>
        <input id="w" inputmode="numeric" value="650">
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend>Visibility</legend>
    <label class="check"><input type="checkbox" checked> Show in the online shop</label>
    <label class="check"><input type="checkbox"> Feature on the home page</label>
  </fieldset>

  <div class="savebar">
    <button type="button">Cancel</button>
    <button type="submit">Save product</button>
  </div>
</form>
</main>
<div class="vh" role="status" aria-live="polite" id="announce"></div>
<script>
document.getElementById('pf').addEventListener('submit',function(e){ e.preventDefault(); document.getElementById('p').focus(); document.getElementById('announce').textContent='Price needs fixing before saving.'; });
</script>
</body>
</html>
