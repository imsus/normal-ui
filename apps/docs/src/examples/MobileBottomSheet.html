<!-- @dsCard level="templates" group="Mobile" height=844 width=390 page subtitle="A bottom action sheet for choices on a phone, built on a modal dialog" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order #1047 · Toko Rumah</title>
<style>
  :root { --tap: 48px; --bar: 56px; }
  *, *::before, *::after { box-sizing:border-box; }
  body { margin:0; }
  .vh { position:absolute !important; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  .skip { position:absolute; left:var(--space-sm); top:-100px; z-index:3; }
  .skip:focus { top:var(--space-sm); background:var(--canvas); padding:var(--space-xs) var(--space-sm); }

  /* Top app bar */
  .m-bar { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:var(--space-sm);
    min-height:var(--bar); padding:env(safe-area-inset-top, 0px) var(--space-md) 0; background:var(--canvas); border-bottom:1px solid var(--rule); }
  .m-bar h1 { flex:1; margin:0; font-size:1.25rem; line-height:1.2; }
  .m-bar .back { display:inline-flex; align-items:center; min-height:var(--tap); min-width:var(--tap); margin-inline-start:calc(-1 * var(--space-sm)); padding-inline:var(--space-sm); }
  .m-bar .act { display:inline-flex; align-items:center; min-height:var(--tap); padding-inline:var(--space-sm); font:1rem var(--font-sans); }
  .m-bar .back { font:1rem var(--font-sans); }

  /* Content column: 16px gutters, room for the tab bar */
  .m-main { padding:var(--space-md) var(--space-md) calc(var(--bar) + var(--space-lg) + env(safe-area-inset-bottom, 0px)); max-width:40rem; margin-inline:auto; }
  .m-main.no-tabs { padding-bottom:calc(var(--space-lg) + env(safe-area-inset-bottom, 0px)); }
  .m-main > :first-child { margin-top:0; }

  /* Bottom tab bar */
  .m-tabs { position:fixed; inset:auto 0 0 0; z-index:2; background:var(--canvas); border-top:1px solid var(--control-border); padding-bottom:env(safe-area-inset-bottom, 0px); }
  .m-tabs ul { display:grid; grid-template-columns:repeat(4, 1fr); list-style:none; margin:0; padding:0; }
  .m-tabs a { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:var(--bar);
    font:0.8125rem/1.2 var(--font-sans); color:var(--canvas-text); text-decoration:none; border-top:3px solid transparent; }
  .m-tabs a[aria-current] { font-weight:700; border-top-color:var(--link); color:var(--link); }
  .m-tabs svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }

  /* Touch sizing: 48px controls, 16px text so phones never zoom into fields */
  .m-main :is(input:not([type=checkbox],[type=radio]), select, textarea) { width:100%; min-height:var(--tap); font-size:1rem; }
  .m-main button { min-height:var(--tap); }
  .block { width:100%; }
  .muted { color:var(--gray-text); }
  .num { text-align:end; font-variant-numeric:tabular-nums; }
  .field { display:grid; gap:var(--space-xs); margin-block:var(--space-md); }
  .hint { font-size:.83em; color:var(--gray-text); }
  .error { font-size:.83em; font-weight:700; }

  .bs { position:fixed; inset:auto 0 0 0; margin:0; width:100%; max-width:100%; max-height:85vh; padding:var(--space-sm) var(--space-md) calc(var(--space-md) + env(safe-area-inset-bottom, 0px)); border:0; border-top:1px solid var(--control-border); }
  .bs .grab { display:block; width:40px; height:4px; margin:0 auto var(--space-sm); background:var(--control-border); }
  .bs h2 { font-size:1.125rem; margin:0 0 var(--space-xs); }
  .bs ul { list-style:none; margin:0; padding:0; }
  .bs li button { width:100%; text-align:start; background:transparent; border:0; border-bottom:1px solid var(--rule); border-radius:0; min-height:52px; font-size:1rem; color:var(--canvas-text); }
  .bs li:last-child button { border-bottom:0; }
  .bs .cancel { margin-top:var(--space-sm); width:100%; }
  @media (prefers-reduced-motion: no-preference) {
    .bs { transition: translate .2s ease, overlay .2s allow-discrete, display .2s allow-discrete; }
    @starting-style { .bs:modal { translate:0 100%; } }
  }

  dl { display:grid; grid-template-columns:auto 1fr; gap:var(--space-xs) var(--space-md); }
  dt { color:var(--gray-text); } dd { margin:0; }
</style>
</head>
<body class="pd-app">
<a class="skip" href="#main">Skip to main content</a>
<header class="m-bar">
<a class="back" href="#orders"><span aria-hidden="true">‹&nbsp;</span>Orders</a>
  <span style="flex:1"></span>
  <button type="button" class="act" id="open" aria-haspopup="dialog" style="min-height:44px">Actions</button>
</header>
<main id="main" class="m-main">
<h1 style="font-size:1.5rem;margin:0">Order #1047 <span class="pd-badge">Packing</span></h1>
<dl><dt>Customer</dt><dd>Sari Wulandari</dd><dt>Total</dt><dd>Rp 412.000</dd><dt>Placed</dt><dd>Today, 10:12</dd></dl>
<dialog class="bs" id="sheet" aria-labelledby="bs-h" closedby="any" open>
  <span class="grab" aria-hidden="true"></span>
  <h2 id="bs-h">Order #1047</h2>
  <form method="dialog">
    <ul>
      <li><button value="ship">Mark as shipped</button></li>
      <li><button value="print">Print packing slip</button></li>
      <li><button value="msg">Message Sari</button></li>
      <li><button value="cancel-order">Cancel order…</button></li>
    </ul>
    <button class="cancel" value="">Close</button>
  </form>
</dialog>
</main>
<nav class="m-tabs" aria-label="Main"><ul><li><a href="#home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</a></li><li><a href="#orders" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Orders</a></li><li><a href="#help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14"/><path d="M12 17.5v.01"/></svg>Help</a></li><li><a href="#account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Account</a></li></ul></nav>
<div class="vh" role="status" aria-live="polite" id="announce"></div>
<script>
var s=document.getElementById('sheet'), o=document.getElementById('open');
o.addEventListener('click',function(){ if(s.open) s.close(); s.showModal(); });
s.addEventListener('close',function(){ if(s.returnValue) document.getElementById('announce').textContent=s.returnValue==='ship'?'Marked as shipped.':''; o.focus(); });
</script>
</body>
</html>
