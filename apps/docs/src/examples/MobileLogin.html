<!-- @dsCard level="pages" group="Mobile" height=844 width=390 page subtitle="Sign-in that meets WCAG 2.2 accessible authentication: paste allowed, password managers, show password" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Toko Rumah</title>
<style>
  :root { --tap: 48px; --bar: 56px; }
  *, *::before, *::after { box-sizing:border-box; }
  body { margin:0; }
  .vh { position:absolute !important; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
  .skip { position:absolute; left:var(--space-sm); top:-100px; z-index:3; }
  .skip:focus { top:var(--space-sm); background:var(--canvas); padding:var(--space-xs) var(--space-sm); }

  /* Top app bar */
  .m-bar { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:var(--space-sm);
    min-height:var(--bar); padding:env(safe-area-inset-top, 0px) var(--space-md) 0; background:var(--canvas); border-bottom:1px solid var(--rule); }
  .m-bar h1 { flex:1; margin:0; font-size:1.25rem; line-height:1.2; }
  .m-bar .back { display:inline-flex; align-items:center; min-height:var(--tap); min-width:var(--tap); margin-inline-start:calc(-1 * var(--space-sm)); padding-inline:var(--space-sm); }
  .m-bar .act { display:inline-flex; align-items:center; min-height:var(--tap); padding-inline:var(--space-sm); font:1rem var(--font-sans); }
  .m-bar .back { font:1rem var(--font-sans); }

  /* Content column: 16px gutters, room for the tab bar */
  .m-main { padding:var(--space-md) var(--space-md) calc(var(--bar) + var(--space-lg) + env(safe-area-inset-bottom, 0px)); max-width:40rem; margin-inline:auto; }
  .m-main.no-tabs { padding-bottom:calc(var(--space-lg) + env(safe-area-inset-bottom, 0px)); }
  .m-main > :first-child { margin-top:0; }

  /* Bottom tab bar */
  .m-tabs { position:fixed; inset:auto 0 0 0; z-index:2; background:var(--canvas); border-top:1px solid var(--control-border); padding-bottom:env(safe-area-inset-bottom, 0px); }
  .m-tabs ul { display:grid; grid-template-columns:repeat(4, 1fr); list-style:none; margin:0; padding:0; }
  .m-tabs a { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:var(--bar);
    font:0.8125rem/1.2 var(--font-sans); color:var(--canvas-text); text-decoration:none; border-top:3px solid transparent; }
  .m-tabs a[aria-current] { font-weight:700; border-top-color:var(--link); color:var(--link); }
  .m-tabs svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }

  /* Touch sizing: 48px controls, 16px text so phones never zoom into fields */
  .m-main :is(input:not([type=checkbox],[type=radio]), select, textarea) { width:100%; min-height:var(--tap); font-size:1rem; }
  .m-main button { min-height:var(--tap); }
  .block { width:100%; }
  .muted { color:var(--gray-text); }
  .num { text-align:end; font-variant-numeric:tabular-nums; }
  .field { display:grid; gap:var(--space-xs); margin-block:var(--space-md); }
  .hint { font-size:.83em; color:var(--gray-text); }
  .error { font-size:.83em; font-weight:700; }

  .m-bar { justify-content:center; }
  .m-bar strong { font-size:1.125rem; }
  .login { max-width:24rem; margin-inline:auto; }
  .login h1 { font-size:1.75rem; margin:var(--space-lg) 0 var(--space-xs); }
  .pw { display:flex; }
  .pw input { flex:1; border-start-end-radius:0; border-end-end-radius:0; }
  .pw button { min-width:4.5rem; border-inline-start:0; border-start-start-radius:0; border-end-start-radius:0; }
  .or { display:flex; align-items:center; gap:var(--space-sm); color:var(--gray-text); font:0.875rem var(--font-sans); margin-block:var(--space-lg); }
  .or::before, .or::after { content:""; flex:1; border-top:1px solid var(--rule); }
  .alt { display:grid; gap:var(--space-sm); }
  .links { display:grid; gap:var(--space-sm); margin-top:var(--space-lg); text-align:center; }
</style>
</head>
<body class="pd-app">
<a class="skip" href="#main">Skip to main content</a>
<header class="m-bar">
<strong>Toko Rumah</strong>
</header>
<main id="main" class="m-main no-tabs">
<div class="login">
  <h1>Sign in</h1>
  <p class="muted" style="margin-top:0">to manage your shop.</p>
  <form id="lf" action="#" method="post">
    <div class="field">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" enterkeyhint="next" value="imam@example.com">
    </div>
    <div class="field">
      <label for="pw">Password</label>
      <div class="pw">
        <input id="pw" name="password" type="password" autocomplete="current-password" enterkeyhint="go" aria-describedby="pw-hint">
        <button type="button" id="show" aria-controls="pw" aria-pressed="false">Show</button>
      </div>
      <span class="hint" id="pw-hint">You can paste it from your password manager.</span>
    </div>
    <p style="margin:0 0 var(--space-md)"><label><input type="checkbox" checked> Keep me signed in on this phone</label></p>
    <button type="submit" class="block">Sign in</button>
  </form>
  <p class="or">or</p>
  <div class="alt">
    <button type="button" class="block">Sign in with a passkey</button>
    <button type="button" class="block">Email me a sign-in link</button>
  </div>
  <div class="links">
    <a href="#forgot">Forgot your password?</a>
    <a href="#signup">New here? Create a shop account</a>
  </div>
</div>
</main>
<div class="vh" role="status" aria-live="polite" id="announce"></div>
<script>
var b=document.getElementById('show'), pw=document.getElementById('pw');
b.addEventListener('click',function(){ var on=pw.type==='password'; pw.type=on?'text':'password'; b.textContent=on?'Hide':'Show'; b.setAttribute('aria-pressed',String(on)); });
document.getElementById('lf').addEventListener('submit',function(e){ e.preventDefault(); if(!pw.value){ pw.focus(); document.getElementById('announce').textContent='Enter your password.'; } });
</script>
</body>
</html>
